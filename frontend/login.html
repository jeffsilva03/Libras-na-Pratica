<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login do professor | Libras na Prática</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lucide-static@0.441.0/font/lucide.min.css">
    <link rel="stylesheet" href="../static/css/style.css">
    <script src="../static/js/principal.js" defer></script>
</head>
<body>
    <header class="topo">
        <nav class="navegacao" aria-label="Navegação principal">
            <a class="marca" href="index.html"><img src="../static/img/logo.png" alt=""><span>Libras na Prática</span></a>
            <a class="botao botao-pequeno" href="conteudos.html">Conteúdos</a>
        </nav>
    </header>

    <main>
        <section class="pagina-formulario">
            <div class="formulario-moldura">
                <p class="rotulo">Acesso restrito</p>
                <h1>Login do professor</h1>
                <div id="mensagem-login"></div>
                <form class="formulario" id="form-login">
                    <label for="email">E-mail</label>
                    <input id="email" name="email" type="email" autocomplete="email" required>

                    <label for="senha">Senha</label>
                    <input id="senha" name="senha" type="password" autocomplete="current-password" required>

                    <button class="botao" type="submit">Entrar</button>
                </form>
            </div>
        </section>
    </main>
</body>
</html>
